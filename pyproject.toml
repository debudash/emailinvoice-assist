[project]
name = "invoice-assist"
version = "0.1.0"
description = "AI email invoice ingestion and matching assistant"
requires-python = ">=3.13"
dependencies = [
    "anthropic[mcp]>=0.116,<1",
    "langsmith>=0.4,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "streamlit>=1.57,<2",
    "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_assist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
